name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke (CLI runs offline on any OS)
        run: |
          npm run -s factory -- adapters
          npm run -s factory -- validate luz-es
          npm run -s factory -- run luz-es --date 2026-06-21 --dry-run
        shell: bash
